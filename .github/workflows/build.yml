name: Build Forpak Launcher + Forpak Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Chaque build a un numéro de version qui augmente : 1.0.1, 1.0.2, ...
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  mods:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.21.1", "1.21.11" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build Forpak Client ${{ matrix.mc }}
        env:
          MOD_VERSION: ${{ env.APP_VERSION }}
        run: |
          dir="mod/v$(echo '${{ matrix.mc }}' | tr '.' '_')"
          gradle -p "$dir" build --no-daemon --stacktrace
          mkdir -p out
          jar=$(ls "$dir"/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$jar" "out/forpakclient-${{ matrix.mc }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.mc }}
          path: out/*.jar

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (un seul .exe)
        run: dotnet publish ForpakLauncher.csproj -c Release -o out -p:Version=${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/ForpakLauncher.exe

  release:
    needs: [ mods, launcher ]
    # On publie le launcher même si un des mods n'a pas compilé
    if: always() && needs.launcher.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer l'ancienne release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo ${{ github.repository }} --cleanup-tag -y || true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fichier de version
        run: echo "${{ env.APP_VERSION }}" > dist/version.txt

      - name: Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Forpak Launcher v${{ env.APP_VERSION }}
          body: "Version ${{ env.APP_VERSION }} — télécharge ForpakLauncher.exe. Les mods se mettent à jour tout seuls depuis le launcher."
          files: |
            dist/ForpakLauncher.exe
            dist/forpakclient-1.21.1.jar
            dist/forpakclient-1.21.11.jar
            dist/version.txt
          make_latest: true
